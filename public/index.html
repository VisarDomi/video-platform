<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tango Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- Main List View -->
    <div id="listView">        
        <div id="archiveSearchContainer" class="search-container">
            <input type="text" id="searchInput" placeholder="Filter (regex)...                v=4.8">
            <button id="getDurationsBtn" title="Fetch all video durations">🕒</button>
        </div>

        <div id="listContainer" class="list-container">
            <!-- Content is injected here by JS -->
            <p id="loadingMessage">Loading...</p>
        </div>
    </div>

    <!-- Main Video View -->
    <div id="videoView" class="hidden">
        <div id="videoContainer">
            <video id="videoPlayer" playsinline></video>
            
            <!-- Quadrant Controls for Archives -->
            <div id="quadrantOverlay" class="hidden">
                <div class="quadrant" data-action="prev"></div>
                <div class="quadrant" data-action="next"></div>
                <div class="quadrant" data-action="seek-backward"></div>
                <div class="quadrant" data-action="seek-forward"></div>
            </div>

            <!-- Top Bar UI -->
            <div id="topBar">
                <div id="streamerName"></div>
                <!-- Time display is now a distinct element above the progress bar -->
                <div id="timeDisplayContainer">
                    <span id="timeDisplay">00:00.000 00:00.000</span>
                </div>
                <!-- Progress bar for Archives -->
                <div id="progressBar" class="hidden">
                    <div id="progressFill"></div>
                    <!-- Container for segment start/end text -->
                    <div id="segmentTextContainer"></div>
                </div>
                <!-- Controls -->
                <div id="controls">
                    <button id="backBtn">↩️</button>
                    <!-- Archive-specific controls -->
                    <div id="archiveControls" class="hidden">
                         <button id="undoPointBtn" class="hidden">↪️</button>
                         <button id="muteBtn">🔊</button>
                         <button id="addPointBtn">📍</button>
                         <button id="createBtn" class="hidden">✂️</button>
                         <button id="deleteBtn" class="hidden">🗑️</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>
    <script type="module" src="/app.js?v=4.8"></script>
</body>
</html>
