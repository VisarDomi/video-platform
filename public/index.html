<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
        <title>Tango Dashboard</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <!-- Main List View -->
        <div id="listView">
            <!-- The list container now only wraps the dynamically generated items -->
            <div id="listContainer" class="list-container">
                <div id="videoItemsWrapper"></div>
            </div>
            <!-- The search container is moved out to become a sticky footer -->
            <div id="searchContainer" class="search-container">
                <input type="text" id="searchInput" placeholder="Filter (regex)..." />
                <button id="clearSearchBtn" class="hidden" title="Clear filter">❌</button>
                <button id="getDurationsBtn" title="Fetch all video durations">🕒</button>
            </div>
        </div>

        <!-- Main Video View -->
        <div id="videoView">
            <div id="videoContainer">
                <video id="videoPlayer" playsinline></video>

                <!-- Quadrant Controls for Videos -->
                <div id="quadrantOverlay" class="hidden">
                    <div class="quadrant" data-action="prev"></div>
                    <div class="quadrant" data-action="next"></div>
                    <div class="quadrant" data-action="seek-backward"></div>
                    <div class="quadrant" data-action="seek-forward"></div>
                </div>

                <!-- Top Bar UI -->
                <div id="topBar">
                    <div id="streamerName"></div>
                    <!-- Time display is now a distinct element above the progress bar -->
                    <div id="timeDisplayContainer">
                        <span id="timeDisplay">00:00.000 00:00.000</span>
                    </div>
                    <!-- Progress bar for Videos -->
                    <div id="progressBar" class="hidden">
                        <div id="progressFill"></div>
                        <!-- Container for segment start/end text -->
                        <div id="segmentTextContainer"></div>
                    </div>
                    <!-- Controls -->
                    <div id="controls">
                        <!-- All player buttons are in one container for left alignment -->
                        <div id="playerControlsContainer">
                            <button id="modeOrUndoBtn"></button>
                            <button id="muteBtn">🔊</button>
                            <button id="goBackBtn" title="Back to List">↩️</button>
                            <button id="addPointBtn" title="Add Point">📍</button>
                            <button id="videoOkBtn" title="Video OK (Move to Edited)">✅</button>
                            <button id="deleteOrCutBtn"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="toastContainer"></div>
        <script type="module" src="/app.ts?v=79"></script>
    </body>
</html>
