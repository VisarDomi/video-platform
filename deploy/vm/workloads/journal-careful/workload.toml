# Appends checksummed records to a journal and acknowledges each one only after
# fsync; a second thread replaces a state file atomically (temp file, fsync,
# rename, fsync of the directory). Expected to pass every cycle.
name = "journal-careful"
description = "fsync before acknowledging; atomic state replacement"
include = ["../shared/journal.py"]
packages = ["python3"]
setup = "python3 journal.py setup"
run = "exec python3 journal.py run --mode careful"
check = "python3 journal.py check"
