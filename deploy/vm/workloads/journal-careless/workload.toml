# The same as journal-careful except for the two classic mistakes: it
# acknowledges a record before fsync, and it rewrites the state file in place
# (truncate, then write). Expected to fail some cycles; that is the point.
name = "journal-careless"
description = "acknowledge before fsync; state rewritten in place"
include = ["../shared/journal.py"]
packages = ["python3"]
setup = "python3 journal.py setup"
run = "exec python3 journal.py run --mode careless"
check = "python3 journal.py check"
